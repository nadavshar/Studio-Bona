name: Arbox Debug (temporary)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Run debug script
        run: node scripts/arbox-debug.mjs

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbox-debug
          path: |
            arbox-debug-html.html
            arbox-debug-text.txt
            arbox-debug-requests.json
            arbox-debug-responses.json
            arbox-debug-screenshot.png
          retention-days: 3
